services:
  - type: web
    name: taskmanager-backend
    runtime: node
    env: node
    region: singapore # hoặc oregon, frankfurt tùy bạn chọn
    plan: free # hoặc starter, standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NPM_CONFIG_PRODUCTION
        value: false # Để cài devDependencies khi build
      - key: DATABASE_URL
        sync: false # Bạn sẽ set giá trị này trong Render Dashboard
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://your-frontend-domain.com
      # Thêm các biến môi trường khác của bạn ở đây
    autoDeploy: true # Tự động deploy khi push code lên branch main
    branch: main # Branch để deploy
